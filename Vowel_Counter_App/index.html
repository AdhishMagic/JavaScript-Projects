<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Counter Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Vowel Counter</h1>
        <textarea id="inputText" placeholder="Type or paste text here..."></textarea>
        <div id="result"></div>
        <div class="controls">
            <button id="clearBtn">Clear</button>
            <button id="countBtn">Count Vowels</button>
            <button id="copyBtn">Copy Result</button>
        </div>

        <script src="script.js"></script>
</body>
</html>
